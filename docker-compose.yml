version: "3.8"

services:
  # ── MySQL 데이터베이스 ──────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: lnc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: lnc_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 애플리케이션 ────────────────────────────────
  app:
    build: .
    container_name: lnc_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lnc_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      JWT_SECRET: lnc_super_secret_key_please_change_in_production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
