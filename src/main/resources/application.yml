spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lnc_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_me_in_prod}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 2592000
